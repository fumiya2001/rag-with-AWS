services:
  db:
    image: ankane/pgvector
    restart: always
    environment:
      POSTGRES_USER: ${ DB_USER }
      POSTGRES_PASSWORD: ${ DB_PASSWORD }
      POSTGRES_DB: ${ DB_NAME }
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_rag_user -d simple_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: always
    environment: &db_env
      DB_HOST: ${ DB_HOST }
      DB_PORT: ${ DB_PORT }
      DB_NAME: ${ DB_NAME }
      DB_USER: ${ DB_USER }
      DB_PASSWORD: ${ DB_PASSWORD }
    volumes:
      - hf_models:/models
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: python:3.12-slim
    restart: always
    working_dir: /app
    volumes:
    - ./app:/app/app
    environment:
      API_URL: http://api:8000/ask
    command: sh -c "pip install --no-cache-dir streamlit requests &&
           streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - api

  
  ingest:
    build: .
    environment: *db_env
    volumes:
      - hf_models:/models
    command: python app/ingest.py
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgdata:
  hf_models:
